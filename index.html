<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tah-game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>tah-game</h1>
    <p class="lede">GitHub Pages is serving this repo.</p>

    <ul class="checks">
      <li>
        <span class="label">HTML</span>
        <span class="state ok" id="check-html">loaded</span>
      </li>
      <li>
        <span class="label">CSS</span>
        <span class="state" id="check-css">not loaded</span>
      </li>
      <li>
        <span class="label">JavaScript</span>
        <span class="state" id="check-js">not loaded</span>
      </li>
    </ul>

    <dl class="meta">
      <dt>Rendered at</dt>
      <dd id="rendered-at">waiting on JS</dd>
      <dt>Served from</dt>
      <dd id="origin">waiting on JS</dd>
    </dl>

    <p class="footer">
      <a href="https://github.com/thataaronguy-sunstream/tah-game">Repository</a>
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
